# Produção (VPS Oracle): usa o Postgres 18 existente (rede db_net) e o Caddy (rede proxy_net).
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# Credenciais do banco em .env.db (permissão 600, fora do git).
services:
  app:
    build:
      context: .
      # "pronto": usa o binário compilado no PC (scripts/subir.sh). Para compilar aqui mesmo: STORYTELLER_ETAPA=final
      target: ${STORYTELLER_ETAPA:-pronto}
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: storyteller
    environment:
      RECORTE_URL: http://storyteller-recorte:7000
    env_file:
      - .env
      - .env.db          # DATABASE_URL do banco storyteller
    volumes:
      - ${DATA_HOST_DIR:-storyteller-data}:/data
      - storyteller-cli:/home/app   # logins dos CLIs (claude/gemini/codex) persistem aqui
    networks: [db_net, proxy_net, default]
    restart: unless-stopped

  # Recorte de fundo das imagens dos personagens (rembg), só na rede interna.
  recorte:
    build: ./recorte
    container_name: storyteller-recorte
    restart: unless-stopped
    mem_limit: 2g

networks:
  db_net:
    external: true
  proxy_net:
    external: true

volumes:
  storyteller-data:
  storyteller-cli:
