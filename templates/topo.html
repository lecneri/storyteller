<header class="topo">
  <nav>
    <strong class="topo-familia">📚 {{ s.familia_nome }}</strong>
    <span class="topo-grupo" aria-label="Livros">
      <a href="/">🗂️ Estantes</a>
      <a href="/historias">📖 Histórias</a>
    </span>
    <span class="topo-grupo" aria-label="Elenco e cenários">
      <a href="/personagens">🎭 Personagens</a>
      <a href="/lugares">📍 Lugares</a>
    </span>
    <span class="topo-grupo" aria-label="Casa">
      <a href="/leitores">🧒 Leitores</a>
      <a href="/familia">👨‍👩‍👧 Família</a>
    </span>
    {% if s.admin_sistema %}<span class="topo-grupo"><a href="/sistema">⚙️ Sistema</a></span>{% endif %}
  </nav>
  <span class="linha">
    {% if s.familias.len() > 1 %}
    <form method="post" action="/trocar-familia" class="inline">
      <select name="familia" onchange="this.form.submit()" title="Trocar de família">
        {% for (fid, fnome) in s.familias %}<option value="{{ fid }}"{% if s.eh_atual(fid) %} selected{% endif %}>{{ fnome }}</option>{% endfor %}
      </select>
    </form>
    {% endif %}
    <a href="/conta">{{ s.usuario_nome }}</a>{% if s.admin_familia() %} · admin{% endif %}
    <form method="post" action="/sair" class="inline"><button class="link">Sair</button></form>
  </span>
</header>
