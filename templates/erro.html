{% extends "base.html" %}
{% block titulo %}{{ titulo }} · Storyteller{% endblock %}
{% block corpo %}
<main class="centro">
  <section class="cartao pagina-erro">
    {% if rasgado %}
    <svg class="livro-erro rasgado" viewBox="0 0 240 170" role="img" aria-label="Livro rasgado e triste">
      <ellipse cx="120" cy="158" rx="92" ry="8" class="sombra"/>
      <g class="metade esq">
        <path d="M118 30 C90 18 52 18 22 28 L22 140 C52 130 90 130 112 142 L104 118 L114 100 L102 80 L112 58 Z" class="capa"/>
        <path d="M112 38 C88 28 56 28 32 36 L32 128 C56 120 88 120 106 130 L98 116 L108 99 L96 80 L106 59 Z" class="folha"/>
        <path d="M44 56 h44 M44 70 h38 M44 84 h30" class="linha-texto"/>
        <ellipse cx="62" cy="100" rx="4" ry="5" class="olho"/>
        <path d="M58 92 l9 -3" class="sobrancelha"/>
        <path d="M60 108 q4 6 0 12 q-4 -6 0 -12" class="lagrima"/>
      </g>
      <g class="metade dir">
        <path d="M126 30 C154 18 192 18 222 28 L222 140 C192 130 154 130 132 142 L140 118 L130 100 L142 80 L132 58 Z" class="capa"/>
        <path d="M132 38 C156 28 188 28 212 36 L212 128 C188 120 156 120 138 130 L146 116 L136 99 L148 80 L138 59 Z" class="folha"/>
        <path d="M158 56 h40 M162 70 h36 M168 84 h30" class="linha-texto"/>
        <ellipse cx="180" cy="100" rx="4" ry="5" class="olho"/>
        <path d="M184 92 l-9 -3" class="sobrancelha"/>
      </g>
      <path d="M100 124 q20 -14 42 0" class="boca"/>
      <path d="M112 22 l-6 -8 M124 18 l0 -10 M136 22 l6 -8" class="faisca"/>
    </svg>
    {% else %}
    <svg class="livro-erro aberto" viewBox="0 0 240 170" role="img" aria-label="Livro aberto com um ponto de interrogação">
      <ellipse cx="120" cy="158" rx="92" ry="8" class="sombra"/>
      <path d="M120 34 C92 20 52 20 18 30 L18 142 C52 132 92 132 120 146 C148 132 188 132 222 142 L222 30 C188 20 148 20 120 34 Z" class="capa"/>
      <path d="M118 40 C92 28 58 28 28 36 L28 132 C58 124 92 124 118 136 Z" class="folha"/>
      <path d="M122 40 C148 28 182 28 212 36 L212 132 C182 124 148 124 122 136 Z" class="folha"/>
      <path d="M120 38 L120 138" class="lombada"/>
      <path d="M44 58 h52 M44 72 h46 M44 86 h50 M44 100 h36" class="linha-texto"/>
      <g class="interrogacao">
        <path d="M152 66 q0 -20 18 -20 q18 0 18 16 q0 12 -14 18 q-4 2 -4 10 v4" class="ponto"/>
        <circle cx="170" cy="110" r="5" class="pingo"/>
      </g>
    </svg>
    {% endif %}
    <p class="codigo-erro">{{ codigo }}</p>
    <h1>{{ titulo }}</h1>
    <p class="suave">{{ texto }}</p>
    <p class="linha"><a class="botao" href="/">🏠 Voltar ao início</a> <a href="javascript:history.back()">← Página anterior</a></p>
  </section>
</main>
{% endblock %}
