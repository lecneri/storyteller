<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Storyteller{% endblock %}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css?v={{ crate::web::versao() }}">
  <!-- Antes dos scripts das páginas (defer roda na ordem do documento). -->
  <script src="/comum.js?v={{ crate::web::versao() }}" defer></script>
  <script src="/colar.js?v={{ crate::web::versao() }}" defer></script>
</head>
<body>
  {% block corpo %}{% endblock %}
  <footer class="rodape"><a href="/creditos">🌟 Créditos</a></footer>
  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>
  <script src="/copiar.js?v={{ crate::web::versao() }}" defer></script>
</body>
</html>
